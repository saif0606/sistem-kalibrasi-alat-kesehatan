<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="#F8FAFC"/>

  <!-- connector lines -->
  <line x1="450" y1="90" x2="450" y2="130" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="200" y1="130" x2="700" y2="130" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="200" y1="130" x2="200" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="450" y1="130" x2="450" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="700" y1="130" x2="700" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="200" y1="250" x2="200" y2="280" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="110" y1="280" x2="290" y2="280" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="110" y1="280" x2="110" y2="310" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="290" y1="280" x2="290" y2="310" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Kepala UPTD -->
  <rect x="330" y="30" width="240" height="60" rx="12" fill="url(#og)"/>
  <text x="450" y="55" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">KEPALA UPTD IFKA</text>
  <text x="450" y="76" font-family="Poppins, sans-serif" font-size="11" fill="#E0F2FE" text-anchor="middle">Dinas Kesehatan Provinsi Lampung</text>

  <!-- Kasubbag TU -->
  <rect x="90" y="160" width="220" height="60" rx="12" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="185" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Kasubbag Tata Usaha</text>
  <text x="200" y="203" font-family="Poppins, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Administrasi &amp; Keuangan</text>

  <!-- Kasi Pengujian -->
  <rect x="340" y="160" width="220" height="60" rx="12" fill="#fff" stroke="#16A34A" stroke-width="1.5"/>
  <text x="450" y="185" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Kasi Pengujian &amp; Kalibrasi</text>
  <text x="450" y="203" font-family="Poppins, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Teknis Lapangan</text>

  <!-- Kasi Pelayanan -->
  <rect x="590" y="160" width="220" height="60" rx="12" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
  <text x="700" y="185" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Kasi Pelayanan &amp; Mutu</text>
  <text x="700" y="203" font-family="Poppins, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Sertifikasi &amp; Monitoring</text>

  <!-- Staff row under Kasubbag TU -->
  <rect x="10" y="310" width="200" height="50" rx="10" fill="#fff" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="110" y="340" font-family="Poppins, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">Staf Administrasi</text>

  <rect x="190" y="310" width="200" height="50" rx="10" fill="#fff" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="290" y="340" font-family="Poppins, sans-serif" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">Staf Keuangan</text>

  <text x="30" y="440" font-family="Poppins, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Struktur Organisasi</text>
  <text x="30" y="460" font-family="Poppins, sans-serif" font-size="11.5" fill="#64748B">Bagan sementara — ganti dengan gambar struktur organisasi resmi</text>
</svg>
